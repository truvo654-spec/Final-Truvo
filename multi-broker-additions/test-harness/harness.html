<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui}#mb-root{position:fixed;inset:0;top:62px;overflow-y:auto;background:#fbfaf9;--b:#5945f1;--t:#f0efff;--h:#f7f5ff;--l1:#eceefa;--l2:#e7e3f5;--tx2:#737373}
#mb-root *{box-sizing:border-box}#mb-root .wrap{max-width:1180px;margin:0 auto;padding:24px}
#mb-root .card{background:#fff;border:1px solid #efece6;border-radius:16px}#mb-root .pad{padding:18px 20px}#mb-root .mb16{margin-bottom:16px}
#mb-root .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}#mb-root .ch h3{margin:0;font-size:16px}
#mb-root .lbl{font-size:12px;color:var(--tx2)}#mb-root .mut{color:var(--tx2)}#mb-root .pos{color:#5f7005}#mb-root .neg{color:var(--b)}
#mb-root .btn{height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--l2);background:#fff;font-size:13px;display:inline-flex;align-items:center}#mb-root .btn.sm{height:28px;font-size:12px}#mb-root .btn.pri{background:var(--b);color:#fff}
#mb-root .lnk{color:var(--b);background:none;border:0;padding:0;font-size:13px;cursor:pointer}
#mb-root .seg{display:inline-flex;padding:3px;border-radius:10px;background:#efeeea;gap:2px}#mb-root .seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:8px;font-size:12px}#mb-root .seg button.on{background:#fff;color:var(--b);font-weight:600}
#mb-root .na{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;border-radius:12px;background:#faf9f6;color:var(--tx2);text-align:center;padding:16px;font-size:13px}
#mb-root .ov{position:fixed;left:0;right:0;bottom:0;top:62px;background:rgba(23,23,23,.28);z-index:50}
#mb-root .drw{position:fixed;right:0;top:62px;bottom:0;width:min(480px,100vw);background:#fff;z-index:51;overflow-y:auto}
#mb-root .dh{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid var(--l1);display:flex;justify-content:space-between;gap:10px}#mb-root .db{padding:16px 20px 40px}#mb-root .db h4{margin:0 0 8px;font-size:13px}
#mb-root .side{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px}#mb-root .buy{background:rgba(135,158,7,.14);color:#5f7005}#mb-root .sell{background:var(--t);color:var(--b)}
#mb-root .gg{display:grid;grid-template-columns:1fr 1fr;gap:8px}#mb-root .gg div{background:#faf9f6;border-radius:10px;padding:8px 10px}#mb-root .gg small{display:block;font-size:11px}
#mb-root .tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px}#mb-root .tag.wa{background:rgba(217,119,6,.12);color:#b45309}
#mb-root .pill{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600}#mb-root .p-pu{background:var(--t);color:var(--b)}
#mb-root table{width:100%;border-collapse:collapse;font-size:13px}#mb-root td,#mb-root th{padding:9px;border-bottom:1px solid #f3f2ee;text-align:left}#mb-root .r{text-align:right}
#mb-root .lg{display:inline-flex;width:24px;height:24px;border-radius:7px;background:#5945f1;color:#fff;font-size:9px;align-items:center;justify-content:center}#mb-root .lg.sm{width:18px;height:18px}
#mb-root .g12r{display:grid;grid-template-columns:2fr 1fr;gap:16px}#mb-root .kv{display:flex;justify-content:space-between}
#mb-root .crow9{display:grid;grid-template-columns:180px 100px 2fr 160px;gap:14px;padding:11px 0;align-items:center}#mb-root .vtrack{display:block;height:12px;background:#ebe9e3;border-radius:6px;position:relative}#mb-root .vtrack i{position:absolute;left:0;top:0;bottom:0}
#mb-root .hide-m{display:block}#mb-root .show-m{display:none}#mb-root span.hide-m{display:inline}
@media (max-width:760px){#mb-root .hide-m{display:none!important}#mb-root .show-m{display:block}#mb-root .g12r{grid-template-columns:1fr}#mb-root .wrap{padding:12px}#mb-root .crow9{grid-template-columns:1fr}}
</style></head><body><div style="height:62px;background:#222"></div><script src="bundle.js"></script></body></html>
